# Tool settings only; this file does not make the repo an installable package.

[tool.ruff]
target-version = "py310"
extend-exclude = ["CADs", "plots", "results", "images"]

[tool.ruff.lint]
# F: pyflakes (undefined names, unused imports/variables, redefinitions)
# E9: syntax errors   E722: bare `except:`
# Report-only for now (CI runs with --exit-zero); tighten once the
# existing findings are cleaned up.
select = ["F", "E9", "E722"]

[tool.codespell]
skip = "./CADs,./plots,./results,./images,./.git,*.json,*.csv,*.pyc"

[tool.pytest.ini_options]
testpaths = ["tests"]
