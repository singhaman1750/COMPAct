name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      golden:
        description: "Also run the slow golden-output check"
        type: boolean
        default: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Compile all Python files
        run: python -m compileall -q -x '(CADs|plots)/' .
      - name: Smoke tests
        run: pytest -q
      # Report-only until the existing findings are cleaned up.
      - name: Lint (ruff, report-only)
        run: ruff check . --exit-zero --statistics
      - name: Spelling (codespell, report-only)
        run: codespell . || true

  golden:
    if: github.event_name == 'workflow_dispatch' && inputs.golden
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Golden-output check
        run: python tests/golden/golden.py check --workers 4
